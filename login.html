<!DOCTYPE html>
<html class="dark" lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#10141a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="PackDay">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="./icons/packday.svg">
  <title>Sign in · PackDay</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, system-ui, sans-serif;
      background: #10141a;
      color: #dfe2eb;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px 16px calc(24px + env(safe-area-inset-bottom, 0px));
      background: radial-gradient(ellipse at top, #25283a 0, #10141a 55%);
    }
    main {
      width: min(100%, 420px);
      padding: 28px;
      border: 1px solid #464554;
      border-radius: 24px;
      background: #181c22;
      box-shadow: 0 24px 80px #0006;
    }
    .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 28px; }
    .brand-icon {
      width: 48px; height: 48px; display: grid; place-items: center;
      border-radius: 15px; background: #262a31; color: #c0c1ff; font-size: 25px;
    }
    h1 { margin: 0; font-size: 25px; letter-spacing: -.5px; }
    .sub { margin: 5px 0 0; color: #c7c4d7; font-size: 13px; }
    h2 { margin: 0 0 8px; font-size: 20px; }
    .intro { margin: 0 0 22px; color: #c7c4d7; line-height: 1.5; font-size: 14px; }
    form { display: grid; gap: 14px; }
    label { display: grid; gap: 7px; color: #dfe2eb; font-size: 13px; font-weight: 600; }
    input {
      width: 100%; min-height: 48px; padding: 0 13px; border: 1px solid #464554;
      border-radius: 12px; background: #10141a; color: #fff; font: inherit;
    }
    input:focus { outline: 2px solid #c0c1ff; outline-offset: 1px; }
    button {
      min-height: 48px; border: 0; border-radius: 12px; cursor: pointer;
      font: 600 14px Inter, system-ui, sans-serif;
    }
    button:disabled { opacity: .6; cursor: wait; }
    #submitButton { margin-top: 3px; background: #c0c1ff; color: #1000a9; }
    #googleButton { width: 100%; margin-top: 14px; background: #262a31; color: #dfe2eb; }
    .switch {
      margin: 18px 0 0; color: #c7c4d7; text-align: center; font-size: 13px;
    }
    .switch button {
      min-height: 0; padding: 4px; background: none; color: #c0c1ff; font: inherit;
    }
    #forgotButton {
      min-height: 0; justify-self: end; padding: 0; background: none;
      color: #c0c1ff; font-size: 13px;
    }
    #message {
      margin: 16px 0 0; color: #ffb4ab; font-size: 13px; line-height: 1.5;
    }
    #message:empty { display: none; }
    .privacy { margin: 20px 0 0; color: #908fa0; font-size: 11px; line-height: 1.5; text-align: center; }
    [hidden] { display: none !important; }
    @media (max-width: 420px) { main { padding: 24px 20px; } }
  </style>
</head>
<body>
  <main>
    <div class="brand">
      <div class="brand-icon" aria-hidden="true">▣</div>
      <div><h1>PackDay</h1><p class="sub">Your day, ready to go.</p></div>
    </div>
    <h2 id="formTitle">Welcome back</h2>
    <p class="intro">Sign in to continue to your schedule, checklist, and calendar.</p>
    <form id="authForm">
      <label>Email address
        <input id="emailInput" name="email" type="email" autocomplete="email" required>
      </label>
      <label>Password
        <input id="passwordInput" name="password" type="password" autocomplete="current-password" minlength="6" required>
      </label>
      <label id="confirmPasswordField" hidden>Create a password
        <input id="confirmPasswordInput" name="confirmPassword" type="password" autocomplete="new-password" minlength="6">
      </label>
      <button id="forgotButton" type="button">Forgot password?</button>
      <button id="submitButton" type="submit">Sign in</button>
    </form>
    <button id="googleButton" type="button">Continue with Google</button>
    <p class="switch"><span id="switchPrompt">New to PackDay?</span>
      <button id="modeButton" type="button">Create account</button>
    </p>
    <p id="message" role="status" aria-live="polite"></p>
    <p class="privacy">Your account is securely managed by Firebase Authentication.</p>
  </main>
  <script src="./firebase-config.js"></script>
  <script type="module" src="./login.js"></script>
</body>
</html>
